<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnTime - Panel del Chofer</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0A0E17;
      color: #F1F5F9;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #111827;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #1E293B;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      color: #38BDF8;
      font-size: 1.5rem;
      margin-bottom: 6px;
      font-weight: 800;
    }

    p {
      color: #94A3B8;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .campo {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #94A3B8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38BDF8;
    }

    .vista-previa {
      width: 100%;
      height: 140px;
      border-radius: 8px;
      border: 2px dashed #334155;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0F172A;
      color: #64748B;
      font-size: 0.85rem;
    }

    .vista-previa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-start {
      background: #16A34A;
      color: white;
    }

    .btn-stop {
      background: #DC2626;
      color: white;
      display: none;
    }

    .estado {
      margin-top: 20px;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 8px;
      background: #1E293B;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚌 OnTime - Panel Chofer</h1>
    <p>Ruta 201 | Turis-Mar c.a.</p>

    <!-- Selector de Unidad -->
    <div class="campo">
      <label>Unidad / Tipo de Bus:</label>
      <select id="tipoBus">
        <option value="Villarroeles">Villarroeles (V)</option>
        <option value="Brisa de la Sierra">Brisa de la Sierra (B)</option>
      </select>
    </div>

    <!-- ID o Número de Unidad -->
    <div class="campo">
      <label>Número de Unidad (ID Bus):</label>
      <input type="number" id="idBus" placeholder="Ej: 101" value="101">
    </div>

    <!-- Cargar Foto de la Unidad -->
    <div class="campo">
      <label>Foto de la Unidad:</label>
      <input type="file" id="fotoUnidad" accept="image/*" onchange="mostrarVistaPrevia(event)">
      <div class="vista-previa" id="boxPrevia">Sin foto seleccionada</div>
    </div>

    <!-- PIN de Autorización -->
    <div class="campo">
      <label>Clave PIN de Autorización:</label>
      <input type="password" id="pinAcceso" placeholder="Ingresa PIN de chofer">
    </div>

    <!-- Botones de Acción -->
    <button id="btnIniciar" class="btn-start" onclick="validarYIniciar()">📡 Iniciar Transmisión GPS</button>
