<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OnTime - Panel Chofer</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0A0E17;
      color: #F1F5F9;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #111827;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      border: 1px solid #1E293B;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .btn-volver {
      display: inline-block;
      margin-bottom: 12px;
      color: #38BDF8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
    }

    h1 {
      color: #38BDF8;
      font-size: 1.3rem;
      margin-bottom: 4px;
      text-align: center;
      font-weight: 800;
    }

    p {
      color: #94A3B8;
      font-size: 0.8rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .campo {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #94A3B8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .vista-previa {
      width: 100%;
      height: 100px;
      border-radius: 8px;
      border: 2px dashed #334155;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0F172A;
      color: #64748B;
      font-size: 0.8rem;
    }

    .vista-previa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-start {
      background: #16A34A;
      color: white;
    }

    .btn-stop {
      background: #DC2626;
      color: white;
      display: none;
    }

    .estado {
      margin-top: 16px;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 8px;
      background: #1E293B;
      border: 1px solid #334155;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="btn-volver">⬅️ Volver al Mapa</a>

    <h1>🚌 OnTime - Chofer</h1>
    <p>Turis-Mar c.a. | Ruta 201</p>

    <div class="campo">
      <label>Línea / Tipo de Bus:</label>
      <select id="tipoBus">
        <option value="Villarroeles">Villarroeles (V)</option>
        <option value="Brisa de la Sierra">Brisa de la Sierra (B)</option>
      </select>
    </div>

    <div class="campo">
      <label>Número de Unidad (ID Bus):</label>
      <input type="number" id="idBus" placeholder="Ej: 101" value="101">
    </div>

    <div class="campo">
      <label>Horario de Salida Asignado:</label>
      <select id="horarioSalida">
        <option value="05:45 AM">05:45 AM</option>
        <option value="06:15 AM">06:15 AM</option>
        <option value="06:25 AM">06:25 AM</option>
        <option value="06:45 AM">06:45 AM</option>
        <option value="07:15 AM">07:15 AM</option>
        <option value="07:45 AM">07:45 AM</option>
        <option value="08:15 AM">08:15 AM</option>
        <option value="08:45 AM">08:45 AM</option>
        <option value="09:15 AM">09:15 AM</option>
        <option value="09:25 AM">09:25 AM</option>
        <option value="09:45 AM">09:45 AM</option>
        <option value="10:15 AM">10:15 AM</option>
        <option value="10:45 AM">10:45 AM</option>
        <option value="11:15 AM">11:15 AM</option>
        <option value="11:25 AM">11:25 AM</option>
        <option value="11:45 AM">11:45 AM</option>
        <option value="12:15 PM">12:15 PM</option>
        <option value="12:45 PM">12:45 PM</option>
        <option value="01:15 PM">01:15 PM</option>
        <option value="02:15 PM">02:15 PM</option>
        <option value="03:15 PM">03:15 PM</option>
        <option value="04:15 PM">04:15 PM</option>
        <option value="05:15 PM">05:15 PM</option>
        <option value="06:15 PM">06:15 PM</option>
      </select>
    </div>

    <div class="campo">
      <label>Foto de la Unidad (Opcional):</label>
      <input type="file" id="fotoUnidad" accept="image/*" onchange="convertirFoto(event)">
      <div class="vista-previa" id="boxPrevia">Sin foto (Opcional)</div>
    </div>

    <div class="campo">
      <label>PIN de Autorización:</label>
      <input type="password" id="pinAcceso" placeholder="Ingresa PIN de chofer" oninput="verificarPinEnTiempoReal()">
    </div>

    <button id="btnIniciar" class="btn-start" onclick="validarYIniciar()">📡 Iniciar Transmisión GPS</button>

    <div class="estado" id="estadoTxt">Estado: Ingrese su PIN de chofer para comenzar.</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ykwhdyvtlhjvusyjqlgb.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_l14m2kh-gahgx8xBwfX0hQ_xGAin';
    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PIN_AUTORIZADO = "2010"; // PIN Secreto
    let fotoEnBase64 = null;

    function convertirFoto(event) {
      const archivo = event.target.files[0];
      const box = document.getElementById('boxPrevia');
      if (archivo) {
        const lector = new FileReader();
        lector.onload = function(e) {
          fotoEnBase64 = e.target.result;
          box.innerHTML = `<img src="${fotoEnBase64}" alt="Foto unidad">`;
        };
        lector.readAsDataURL(archivo);
      } else {
        fotoEnBase64 = null;
        box.innerHTML = 'Sin foto (Opcional)';
      }
    }

    function verificarPinEnTiempoReal() {
      const pinIngresado = document.getElementById('pinAcceso').value;
      const estadoDiv = document.getElementById('estadoTxt');

      if (pinIngresado === PIN_AUTORIZADO) {
        estadoDiv.innerHTML = '<span style="color:#4ADE80; font-weight:bold;">✅ PIN Correcto. Presiona Iniciar Transmisión.</span>';
        estadoDiv.style.borderColor = '#16A34A';
      } else if (pinIngresado.length >= 4) {
        estadoDiv.innerHTML = '<span style="color:#EF4444; font-weight:bold;">❌ PIN Incorrecto.</span>';
        estadoDiv.style.borderColor = '#DC2626';
      } else {
        estadoDiv.innerHTML = 'Estado: Ingrese su PIN de chofer para comenzar.';
        estadoDiv.style.borderColor = '#334155';
      }
    }

    function validarYIniciar() {
      const pinIngresado = document.getElementById('pinAcceso').value;
      const idBus = document.getElementById('idBus').value;

      if (pinIngresado !== PIN_AUTORIZADO) {
        alert("❌ PIN Incorrecto. Solo personal autorizado.");
        return;
      }

      if (!idBus) {
        alert("⚠️ Por favor ingresa el número de tu unidad.");
        return;
      }

      if (!navigator.geolocation) {
        alert("⚠️ Su dispositivo no soporta geolocalización GPS.");
        return;
      }

      const tipoBus = document.getElementById('tipoBus').value;
      const horarioSeleccionado = document.getElementById('horarioSalida').value;

      document.getElementById('estadoTxt').innerHTML = '<span style="color:#38BDF8;">📡 Activando GPS y abriendo mapa...</span>';

      // Captura de ubicación directa
      navigator.geolocation.getCurrentPosition(
        async (posicion) => {
          const lat = posicion.coords.latitude;
          const lng = posicion.coords.longitude;
          const vel = posicion.coords.speed ? (posicion.coords.speed * 3.6).toFixed(1) : 0;

          // Guardar posición inicial en Supabase
          const { error } = await clienteSupabase
            .from('ubicaciones_tiempo_real')
            .upsert({
              id_bus: parseInt(idBus),
              latitud: lat,
              longitud: lng,
              velocidad: parseFloat(vel),
              foto_url: fotoEnBase64 || null,
              horario_salida: horarioSeleccionado,
              estado_unidad: 'SALIO',
              timestamp: new Date().toISOString()
            }, { onConflict: 'id_bus' });

          if (error) {
            alert("Error conectando con el servidor. Intente de nuevo.");
            return;
          }

          // REDIRECCIÓN AUTOMÁTICA AL MAPA PRINCIPAL CON UNIDAD ACTIVA
          window.location.href = `index.html?busActive=${idBus}&hora=${encodeURIComponent(horarioSeleccionado)}`;
        },
        (error) => {
          alert("⚠️ Activa los permisos de ubicación/GPS en tu celular para transmitir.");
          document.getElementById('estadoTxt').innerHTML = '<span style="color:#EF4444;">⚠️ Activa la ubicación en tu teléfono.</span>';
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
