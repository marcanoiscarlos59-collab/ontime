<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OnTime - Ruta 201</title>

  <!-- Leaflet CSS/JS y Supabase -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0A0E17;
      color: #F1F5F9;
      overflow: hidden;
    }

    header {
      background-color: #111827;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #8B5CF6;
      z-index: 1000;
    }

    .header-info h1 {
      font-size: 1.1rem;
      background: linear-gradient(90deg, #A855F7, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .btn-chofer {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8B5CF6;
      color: #C084FC;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      text-decoration: none;
    }

    #contenedor-app {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
    }

    .selector-origen {
      display: flex;
      background: #0F172A;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #1E293B;
    }

    .btn-origen {
      flex: 1;
      padding: 10px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #94A3B8;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-origen.activo {
      background: #8B5CF6;
      color: white;
      border-color: #A855F7;
    }

    #mapa {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    #panel-horarios {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0F172A;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-top: 2px solid #334155;
      max-height: 48vh;
      display: flex;
      flex-direction: column;
      z-index: 999;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }

    .barrita-desplazamiento {
      width: 40px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 8px auto 4px auto;
    }

    .lista-scroll {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tarjeta-horario {
      background: #1E293B;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .info-linea {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-letra {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-v {
      background: rgba(168, 85, 247, 0.2);
      color: #C084FC;
      border: 1px solid #A855F7;
    }

    .badge-b {
      background: rgba(56, 189, 248, 0.2);
      color: #38BDF8;
      border: 1px solid #38BDF8;
    }

    .detalle-hora {
      display: flex;
      flex-direction: column;
    }

    .hora-texto {
      font-size: 1rem;
      font-weight: 800;
      color: #F8FAFC;
    }

    .estado-bus {
      font-size: 0.7rem;
      color: #94A3B8;
      margin-top: 2px;
    }

    .estado-bus.en-ruta {
      color: #4ADE80;
      font-weight: bold;
    }

    .btn-ver-bus {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .icono-marcador {
      font-size: 1.8rem;
      text-align: center;
    }

    .img-bus-popup {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>🚏 Turis-Mar | Ruta 201</h1>
    </div>
    <a href="conductor.html" class="btn-chofer">🔑 Chofer</a>
  </header>

  <div id="contenedor-app">
    <div class="selector-origen">
      <button class="btn-origen activo" id="btn-jg" onclick="enfocarUbicacion('JuanGriego')">🚌 Juan Griego</button>
      <button class="btn-origen" id="btn-vela" onclick="enfocarUbicacion('LaVela')">🛍️ CC La Vela</button>
    </div>

    <div id="mapa"></div>

    <div id="panel-horarios">
      <div class="barrita-desplazamiento"></div>
      <div class="lista-scroll" id="lista-horarios">Cargando horarios...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ykwhdyvtlhjvusyjqlgb.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_l14m2kh-gahgx8xBwfX0hQ_xGAin';
    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Coordenadas reales corregidas
    const COORDS_JUAN_GRIEGO = [11.0825, -63.9664];
    const COORDS_LA_VELA = [10.9795, -63.8209]; // C.C. La Vela (Av. Bolívar)

    const mapa = L.map('mapa', { zoomControl: false }).setView(COORDS_JUAN_GRIEGO, 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(mapa);

    setTimeout(() => { mapa.invalidateSize(); }, 300);

    let marcadorPunto = null;
    let marcadorBus = null;
    let destinoActual = 'JuanGriego';
    let unidadesActivas = [];

    const iconoParada = L.divIcon({
      html: '<div class="icono-marcador">🚏</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const iconoBusLive = L.divIcon({
      html: '<div class="icono-marcador">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const horariosOficiales = {
      JuanGriego: [
        { linea: 'B', hora: '05:45 AM' }, { linea: 'B', hora: '12:45 PM' },
        { linea: 'B', hora: '06:15 AM' }, { linea: 'V', hora: '01:15 PM' },
        { linea: 'V', hora: '06:25 AM' }, { linea: 'V', hora: '02:15 PM' },
        { linea: 'V', hora: '06:45 AM' }, { linea: 'V', hora: '03:15 PM' },
        { linea: 'B', hora: '07:15 AM' }, { linea: 'V', hora: '04:15 PM' },
        { linea: 'V', hora: '07:45 AM' }, { linea: 'V', hora: '05:15 PM' },
        { linea: 'V', hora: '08:15 AM' }, { linea: 'V', hora: '06:15 PM' },
        { linea: 'V', hora: '08:45 AM' },
        { linea: 'B', hora: '09:15 AM' }, { linea: 'V', hora: '09:25 AM' },
        { linea: 'V', hora: '09:45 AM' }, { linea: 'V', hora: '10:15 AM' },
        { linea: 'V', hora: '10:45 AM' }, { linea: 'B', hora: '11:15 AM' },
        { linea: 'V', hora: '11:25 AM' }, { linea: 'B', hora: '11:45 AM' },
        { linea: 'V', hora: '12:15 PM' }
      ],
      LaVela: [
        { linea: 'V', hora: '06:30 AM' }, { linea: 'B', hora: '01:15 PM' },
        { linea: 'B', hora: '07:15 AM' }, { linea: 'V', hora: '02:15 PM' },
        { linea: 'V', hora: '07:45 AM' }, { linea: 'B', hora: '03:15 PM' },
        { linea: 'B', hora: '08:15 AM' }, { linea: 'V', hora: '04:15 PM' },
        { linea: 'V', hora: '08:45 AM' }, { linea: 'B', hora: '04:45 PM' },
        { linea: 'B', hora: '09:15 AM' }, { linea: 'B', hora: '05:15 PM' },
        { linea: 'V', hora: '09:45 AM' }, { linea: 'V', hora: '05:45 PM' },
        { linea: 'B', hora: '10:15 AM' }, { linea: 'V', hora: '06:15 PM' },
        { linea: 'V', hora: '10:45 AM' }, { linea: 'V', hora: '06:45 PM' },
        { linea: 'B', hora: '11:15 AM' }, { linea: 'V', hora: '07:15 PM' },
        { linea: 'V', hora: '11:45 AM' }, { linea: 'V', hora: '08:15 PM' },
        { linea: 'B', hora: '12:15 PM' }, { linea: 'V', hora: '12:45 PM' }
      ]
    };

    function enfocarUbicacion(destino) {
      destinoActual = destino;
      document.querySelectorAll('.btn-origen').forEach(b => b.classList.remove('activo'));

      if (destino === 'JuanGriego') {
        document.getElementById('btn-jg').classList.add('activo');
        mapa.flyTo(COORDS_JUAN_GRIEGO, 16, { duration: 1.2 });
        mostrarPin(COORDS_JUAN_GRIEGO, "🚏 Terminal Juan Griego");
      } else {
        document.getElementById('btn-vela').classList.add('activo');
        mapa.flyTo(COORDS_LA_VELA, 16, { duration: 1.2 });
        mostrarPin(COORDS_LA_VELA, "🛍️ C.C. La Vela (Av. Bolívar)");
      }

      sincronizarYRenderizar();
    }

    function mostrarPin(coords, texto) {
      if (marcadorPunto) mapa.removeLayer(marcadorPunto);
      marcadorPunto = L.marker(coords, { icon: iconoParada }).addTo(mapa);
      marcadorPunto.bindPopup(`<b style="color:#111;">${texto}</b>`).openPopup();
    }

    async function sincronizarYRenderizar() {
      const { data: ubicaciones } = await clienteSupabase
        .from('ubicaciones_tiempo_real')
        .select('*');

      unidadesActivas = ubicaciones || [];
      renderizarHorariosNormales();

      const params = new URLSearchParams(window.location.search);
      const busActive = params.get('busActive');
      if (busActive) {
        const bus = unidadesActivas.find(b => b.id_bus == busActive);
        if (bus) ubicarEnMapa(bus, bus.horario_salida);
      }
    }

    function renderizarHorariosNormales() {
      const contenedor = document.getElementById('lista-horarios');
      contenedor.innerHTML = '';

      const lista = horariosOficiales[destinoActual];

      lista.forEach(item => {
        const busActivo = unidadesActivas.find(b => b.horario_salida === item.hora && b.estado_unidad === 'SALIO');

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-horario';
        
        const claseLetra = item.linea === 'V' ? 'badge-v' : 'badge-b';
        const nombreLinea = item.linea === 'V' ? 'Villarroeles' : 'Brisa de la Sierra';

        let textoEstado = '<span class="estado-bus">⏳ Aún no ha salido</span>';
        if (busActivo) {
          textoEstado = `<span class="estado-bus en-ruta">🟢 En vía (Unidad #${busActivo.id_bus})</span>`;
        }

        tarjeta.innerHTML = `
          <div class="info-linea">
            <span class="badge-letra ${claseLetra}" title="${nombreLinea}">${item.linea}</span>
            <div class="detalle-hora">
              <div class="hora-texto">${item.hora}</div>
              ${textoEstado}
            </div>
          </div>
          <button class="btn-ver-bus" onclick="rastrearUnidad('${item.hora}')">📍 Ver Bus</button>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    async function rastrearUnidad(horaSeleccionada) {
      const busEncontrado = unidadesActivas.find(b => b.horario_salida === horaSeleccionada);

      if (!busEncontrado) {
        const { data: ultimos } = await clienteSupabase
          .from('ubicaciones_tiempo_real')
          .select('*')
          .order('timestamp', { ascending: false })
          .limit(1);

        if (!ultimos || ultimos.length === 0) {
          alert(`La unidad de las ${horaSeleccionada} aún no ha encendido el GPS en la vía.`);
          return;
        }

        ubicarEnMapa(ultimos[0], horaSeleccionada);
        return;
      }

      ubicarEnMapa(busEncontrado, horaSeleccionada);
    }

    function ubicarEnMapa(bus, horaSeleccionada) {
      mapa.flyTo([bus.latitud, bus.longitud], 16, { duration: 1.2 });

      if (marcadorBus) mapa.removeLayer(marcadorBus);

      let imagenHTML = bus.foto_url ? `<img src="${bus.foto_url}" class="img-bus-popup" alt="Unidad">` : '';

      marcadorBus = L.marker([bus.latitud, bus.longitud], { icon: iconoBusLive }).addTo(mapa);
      marcadorBus.bindPopup(`
        <div style="color:#111; text-align:center;">
          <b>🚌 Bus en Vivo (${bus.horario_salida || horaSeleccionada})</b><br>
          <b>Unidad ID:</b> #${bus.id_bus}<br>
          <b>Velocidad:</b> ${bus.velocidad || 0} km/h
          ${imagenHTML}
        </div>
      `).openPopup();
    }

    setInterval(sincronizarYRenderizar, 15000);
    enfocarUbicacion('JuanGriego');
  </script>
</body>
</html>
