    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0A0E17;
      color: #F1F5F9;
      overflow: hidden;
    }

    header {
      background-color: #111827;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #8B5CF6;

    }

    .header-info h1 {
      font-size: 1.2rem;
      background: linear-gradient(90deg, #A855F7, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .btn-chofer {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8B5CF6;
      color: #C084FC;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      text-decoration: none;
    }

    #contenedor-app {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
    }

    .selector-origen {
      display: flex;
      background: #0F172A;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #1E293B;
    }

    .btn-origen {
      flex: 1;
      padding: 10px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #94A3B8;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-origen.activo {
      background: #8B5CF6;
      color: white;
      border-color: #A855F7;
    }

    #mapa {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    #panel-horarios {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0F172A;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-top: 2px solid #334155;
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      z-index: 999;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }

    .barrita-desplazamiento {
      width: 40px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 8px auto 4px auto;
    }

    .lista-scroll {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tarjeta-horario {
      background: #1E293B;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .hora-texto {
      font-size: 1.15rem;
      font-weight: 800;
      color: #F8FAFC;
    }

    .btn-ver-bus {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .icono-marcador {
      font-size: 1.8rem;
      text-align: center;
    }

    .img-bus-popup {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 6px;
    }
  </style>
</head>
