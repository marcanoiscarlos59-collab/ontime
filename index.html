<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OnTime - Ruta 201</title>

  <!-- Leaflet CSS/JS y Supabase -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0A0E17;
      color: #F1F5F9;
      overflow: hidden;
    }

    header {
      background-color: #111827;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #8B5CF6;
      z-index: 1000;
    }

    .header-info h1 {
      font-size: 1.2rem;
      background: linear-gradient(90deg, #A855F7, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .btn-chofer {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8B5CF6;
      color: #C084FC;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      text-decoration: none;
    }

    #contenedor-app {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
    }

    /* Selector de paradas móviles */
    .selector-origen {
      display: flex;
      background: #0F172A;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #1E293B;
    }

    .btn-origen {
      flex: 1;
      padding: 10px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #94A3B8;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-origen.activo {
      background: #8B5CF6;
      color: white;
      border-color: #A855F7;
    }

    #mapa {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Panel desplegable de horarios para celular */
    #panel-horarios {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0F172A;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-top: 2px solid #334155;
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      z-index: 999;
      transition: transform 0.3s ease;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }

    .barrita-desplazamiento {
      width: 40px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 8px auto 4px auto;
    }

    .lista-scroll {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tarjeta-horario {
      background: #1E293B;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .hora-texto {
      font-size: 1.15rem;
      font-weight: 800;
      color: #F8FAFC;
    }

    .btn-ver-bus {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .icono-marcador {
      font-size: 1.8rem;
      text-align: center;
    }

    .img-bus-popup {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>🚏 OnTime | Ruta 201</h1>
    </div>
    <a href="conductor.html" class="btn-chofer">🔑 Chofer</a>
  </header>

  <div id="contenedor-app">
    <div class="selector-origen">
      <button class="btn-origen activo" id="btn-jg" onclick="enfocarUbicacion('JuanGriego')">🚌 Juan Griego</button>
      <button class="btn-origen" id="btn-vela" onclick="enfocarUbicacion('LaVela')">🛍️ CC La Vela</button>
    </div>

    <div id="mapa"></div>

    <div id="panel-horarios">
      <div class="barrita-desplazamiento"></div>
      <div class="lista-scroll" id="lista-horarios">Cargando horarios...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ykwhdyvtlhjvusyjqlgb.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_l14m2kh-gahgx8xBwfX0hQ_xGAin';
    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COORDS_JUAN_GRIEGO = [11.0825, -63.9664];
    const COORDS_LA_VELA = [11.0250, -63.8340];

    const mapa = L.map('mapa', { zoomControl: false }).setView(COORDS_JUAN_GRIEGO, 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(mapa);

    setTimeout(() => { mapa.invalidateSize(); }, 300);

    let marcadorPunto = null;
    let marcadorBus = null;
    let destinoActual = 'JuanGriego';

    const iconoParada = L.divIcon({
      html: '<div class="icono-marcador">🚏</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const iconoBusLive = L.divIcon({
      html: '<div class="icono-marcador">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const horariosLocales = {
      JuanGriego: [
        '05:45', '06:15', '06:25', '06:45', '07:15', '07:45', 
        '08:15', '08:45', '09:15', '09:25', '09:45', '10:15', 
        '10:45', '11:15', '11:25', '11:45', '12:15', '12:45', 
        '13:15', '14:15', '15:15', '16:15', '17:15', '18:15'
      ],
      LaVela: [
        '06:30', '07:15', '07:45', '08:15', '08:45', '09:15', 
        '09:45', '10:15', '10:45', '11:15', '11:45', '12:15', 
        '12:45', '13:15', '14:15', '15:15', '16:15', '16:45', 
        '17:15', '17:45', '18:15', '18:45', '19:15', '20:15'
      ]
    };

    function enfocarUbicacion(destino) {
      destinoActual = destino;
      document.querySelectorAll('.btn-origen').forEach(b => b.classList.remove('activo'));

      if (destino === 'JuanGriego') {
        document.getElementById('btn-jg').classList.add('activo');
        mapa.flyTo(COORDS_JUAN_GRIEGO, 16, { duration: 1.2 });
        mostrarPin(COORDS_JUAN_GRIEGO, "🚏 Terminal Juan Griego");
      } else {
        document.getElementById('btn-vela').classList.add('activo');
        mapa.flyTo(COORDS_LA_VELA, 16, { duration: 1.2 });
        mostrarPin(COORDS_LA_VELA, "🛍️ CC La Vela");
      }

      renderizarHorariosDinamicamente();
    }

    function mostrarPin(coords, texto) {
      if (marcadorPunto) mapa.removeLayer(marcadorPunto);
      marcadorPunto = L.marker(coords, { icon: iconoParada }).addTo(mapa);
      marcadorPunto.bindPopup(`<b style="color:#111;">${texto}</b>`).openPopup();
    }

    function renderizarHorariosDinamicamente() {
      const contenedor = document.getElementById('lista-horarios');
      contenedor.innerHTML = '';

      const ahora = new Date();
      const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();
      const lista = horariosLocales[destinoActual];

      const horariosFuturos = lista.filter(horaStr => {
        const [h, m] = horaStr.split(':').map(Number);
        return (h * 60 + m) >= minutosActuales;
      });

      const listaAMostrar = (horariosFuturos.length > 0) ? horariosFuturos : lista;

      listaAMostrar.forEach(hora => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-horario';
        tarjeta.innerHTML = `
          <div class="hora-texto">🕒 ${hora}</div>
          <button class="btn-ver-bus" onclick="rastrearUnidad('${hora}')">📍 Ver Bus</button>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    async function rastrearUnidad(hora) {
      const { data: ubicaciones } = await clienteSupabase
        .from('ubicaciones_tiempo_real')
        .select('*')
        .order('timestamp', { ascending: false })
        .limit(1);

      if (!ubicaciones || ubicaciones.length === 0) {
        alert(`La unidad de las ${hora} aún no ha encendido el GPS.`);
        return;
      }

      const bus = ubicaciones[0];
      mapa.flyTo([bus.latitud, bus.longitud], 16, { duration: 1.2 });

      if (marcadorBus) mapa.removeLayer(marcadorBus);

      let imagenHTML = bus.foto_url ? `<img src="${bus.foto_url}" class="img-bus-popup" alt="Unidad">` : '';

      marcadorBus = L.marker([bus.latitud, bus.longitud], { icon: iconoBusLive }).addTo(mapa);
      marcadorBus.bindPopup(`
        <div style="color:#111; text-align:center;">
          <b>🚌 Bus en Vivo (${hora})</b><br>
          <b>Velocidad:</b> ${bus.velocidad || 0} km/h
          ${imagenHTML}
        </div>
      `).openPopup();
    }

    setInterval(renderizarHorariosDinamicamente, 60000);
    enfocarUbicacion('JuanGriego');
  </script>
</body>
</html>
