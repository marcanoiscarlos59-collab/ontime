<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnTime - Transporte Isla de Margarita</title>

  <!-- Librerías de Leaflet (Mapas) y Supabase JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #F8FAFC;
    }

    header {
      background-color: #0F172A;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 1.4rem;
      color: #38BDF8;
    }

    #contenedor-principal {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #panel-lateral {
      width: 380px;
      background-color: #FFFFFF;
      border-right: 1px solid #E2E8F0;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #mapa {
      flex: 1;
      height: 100%;
    }

    .seccion-titulo {
      font-size: 1.1rem;
      color: #0F172A;
      border-bottom: 2px solid #0EA5E9;
      padding-bottom: 5px;
      margin-bottom: 12px;
    }

    /* Pestañas de Navegación */
    .pestanas-rutas {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-pestana {
      flex: 1;
      padding: 8px;
      border: 1px solid #0EA5E9;
      background: white;
      color: #0EA5E9;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-pestana.activo {
      background: #0EA5E9;
      color: white;
    }

    /* Estilos para Tarjeta de Horarios */
    .tarjeta-horario {
      background: #F1F5F9;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-horario strong {
      display: block;
      color: #0F172A;
      font-size: 0.95rem;
    }

    .info-horario span {
      font-size: 0.8rem;
      color: #64748B;
    }

    /* Botón de Notificación */
    .btn-notificar {
      background: #0284C7;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-notificar.activado {
      background: #16A34A;
    }

    .tarjeta-parada {
      background: white;
      padding: 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      border-left: 4px solid #0EA5E9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚏 OnTime - Isla de Margarita</h1>
    <span>Estado: <strong style="color: #4ADE80;">En Vivo</strong></span>
  </header>

  <div id="contenedor-principal">
    <!-- Panel Lateral -->
    <div id="panel-lateral">
      
      <!-- Menú de Horarios y Notificaciones -->
      <div>
        <h2 class="seccion-titulo">⏰ Horarios de Salida</h2>
        <div class="pestanas-rutas">
          <button class="btn-pestana activo" onclick="cambiarSentido('IDA')">Punto A ➔ Punto B</button>
          <button class="btn-pestana" onclick="cambiarSentido('VUELTA')">Punto B ➔ Punto A</button>
        </div>
        <div id="lista-horarios">Cargando horarios...</div>
      </div>

      <!-- Paradas y Ubicación -->
      <div>
        <h2 class="seccion-titulo">📍 Paradas Cercanas</h2>
        <div id="lista-paradas">Cargando paradas...</div>
      </div>

    </div>

    <!-- Contenedor del Mapa -->
    <div id="mapa"></div>
  </div>

  <script>
    // ========================================================
    // 1. CONFIGURACIÓN SUPABASE
    // ========================================================
    const SUPABASE_URL = 'https://ykwhdyvtlhjvusyjqlgb.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_l14m2kh-gahgx8xBwfX0hQ_xGAin';

    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let sentidoActual = 'IDA';

    // Solicitud de permiso para Notificaciones Web del Navegador
    if ("Notification" in window) {
      Notification.requestPermission();
    }

    // ========================================================
    // 2. INICIALIZAR MAPA CENTRADO EN ISLA DE MARGARITA
    // ========================================================
    const mapa = L.map('mapa').setView([11.0000, -63.9000], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(mapa);

    // ========================================================
    // 3. HORARIOS Y SISTEMA DE NOTIFICACIONES
    // ========================================================
    async function cargarHorarios() {
      const { data: horarios, error } = await clienteSupabase
        .from('horarios')
        .select(`
          id,
          dia_semana,
          hora_salida,
          observacion,
          rutas ( nombre_ruta, origen, destino )
        `)
        .order('hora_salida', { ascending: true });

      const contenedor = document.getElementById('lista-horarios');

      if (error || !horarios || horarios.length === 0) {
        contenedor.innerHTML = '<p style="font-size:0.85rem;">No hay horarios cargados aún.</p>';
        return;
      }

      contenedor.innerHTML = '';

      horarios.forEach(h => {
        const horaFormateada = h.hora_salida.substring(0, 5);
        const ruta = h.rutas ? h.rutas.nombre_ruta : 'Ruta General';

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-horario';
        tarjeta.innerHTML = `
          <div class="info-horario">
            <strong>${horaFormateada} hrs</strong>
            <span>${ruta} (${h.dia_semana})</span>
          </div>
          <button class="btn-notificar" onclick="activarNotificacion('${horaFormateada}', '${ruta}', this)">
            🔔 Notificarme
          </button>
        `;

        contenedor.appendChild(tarjeta);
      });
    }

    function cambiarSentido(sentido) {
      sentidoActual = sentido;
      document.querySelectorAll('.btn-pestana').forEach(btn => btn.classList.remove('activo'));
      event.target.classList.add('activo');
      cargarHorarios();
    }

    function activarNotificacion(hora, ruta, boton) {
      if (Notification.permission === "granted") {
        boton.classList.toggle('activado');
        if(boton.classList.contains('activado')) {
          boton.innerHTML = '✅ Activada';
          new Notification("OnTime - Alerta Activada", {
            body: `Te avisaremos cuando el bus de la ruta ${ruta} esté por salir (${hora}).`,
            icon: "https://cdn-icons-png.flaticon.com/512/3448/3448339.png"
          });
        } else {
          boton.innerHTML = '🔔 Notificarme';
        }
      } else {
        alert("Por favor habilita las notificaciones en tu navegador para usar esta función.");
      }
    }

    // ========================================================
    // 4. UBICACIÓN EN TIEMPO REAL (MONITOREO DE BUSES)
    // ========================================================
    let marcadoresBuses = {};

    clienteSupabase
      .channel('bus-movimiento')
      .on('postgres_changes', { 
        event: 'INSERT', 
        schema: 'public', 
        table: 'ubicaciones_tiempo_real' 
      }, payload => {
        const nuevaUbicacion = payload.new;
        const idBus = nuevaUbicacion.id_bus;

        // Si el bus ya está en el mapa se actualiza la posición, si no, se crea
        if (marcadoresBuses[idBus]) {
          marcadoresBuses[idBus].setLatLng([nuevaUbicacion.latitud, nuevaUbicacion.longitud]);
        } else {
          marcadoresBuses[idBus] = L.marker([nuevaUbicacion.latitud, nuevaUbicacion.longitud]).addTo(mapa);
        }

        marcadoresBuses[idBus].bindPopup(`
          <b>🚌 Bus en Vivo #${idBus}</b><br>
          Velocidad: ${nuevaUbicacion.velocidad || 0} km/h<br>
          Última actualización: En este momento
        `).openPopup();
      })
      .subscribe();

    // ========================================================
    // 5. PARADAS EN EL MAPA
    // ========================================================
    async function cargarParadas() {
      const { data: paradas } = await clienteSupabase.from('paradas').select('*');
      const contenedor = document.getElementById('lista-paradas');

      if (!paradas || paradas.length === 0) {
        contenedor.innerHTML = '<p style="font-size: 0.85rem;">No hay paradas registradas.</p>';
        return;
      }

      contenedor.innerHTML = '';
      paradas.forEach(parada => {
        const marcador = L.marker([parada.latitud, parada.longitud]).addTo(mapa);
        marcador.bindPopup(`<b>🚏 Parada: ${parada.nombre_parada}</b>`);

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-parada';
        tarjeta.innerHTML = `<h3>🚏 ${parada.nombre_parada}</h3>`;
        tarjeta.onclick = () => {
          mapa.flyTo([parada.latitud, parada.longitud], 15);
          marcador.openPopup();
        };
        contenedor.appendChild(tarjeta);
      });
    }

    // Ejecución inicial
    cargarHorarios();
    cargarParadas();
  </script>
</body>
</html>
