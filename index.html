<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnTime - Isla de Margarita</title>

  <!-- Librerías de Leaflet (Mapas) y Supabase JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0B0F19;
      color: #F8FAFC;
    }

    header {
      background-color: #111827;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1F2937;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.5rem;
      color: #38BDF8;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .estado-en-vivo {
      background: rgba(16, 185, 129, 0.1);
      color: #34D399;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    #contenedor-principal {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #panel-lateral {
      width: 400px;
      background-color: #111827;
      border-right: 1px solid #1F2937;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    #mapa {
      flex: 1;
      height: 100%;
    }

    .seccion-titulo {
      font-size: 1.05rem;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* Tarjeta de Horarios Interactiva */
    .tarjeta-horario {
      background: #1F2937;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #374151;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tarjeta-horario:hover {
      background: #374151;
      border-color: #38BDF8;
      transform: translateY(-1px);
    }

    .info-horario .hora {
      display: block;
      color: #F8FAFC;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .info-horario .ruta {
      font-size: 0.85rem;
      color: #94A3B8;
    }

    .badge-accion {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .badge-accion:hover {
      background: #0ea5e9;
    }

    .tarjeta-parada {
      background: #1F2937;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      border-left: 4px solid #38BDF8;
      cursor: pointer;
      border-top: 1px solid #374151;
      border-right: 1px solid #374151;
      border-bottom: 1px solid #374151;
      transition: background 0.2s;
    }

    .tarjeta-parada:hover {
      background: #374151;
    }

    .tarjeta-parada h3 {
      font-size: 0.95rem;
      color: #F8FAFC;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚏 OnTime <span style="font-size: 0.9rem; color: #94A3B8; font-weight: normal;">| Margarita</span></h1>
    <div class="estado-en-vivo">● En Vivo</div>
  </header>

  <div id="contenedor-principal">
    <!-- Panel Lateral -->
    <div id="panel-lateral">
      
      <!-- Menú de Horarios Interactivos -->
      <div>
        <h2 class="seccion-titulo">⏰ Horarios y Unidades en Ruta</h2>
        <div id="lista-horarios">Cargando horarios...</div>
      </div>

      <!-- Paradas y Ubicación -->
      <div>
        <h2 class="seccion-titulo">📍 Paradas de la Isla</h2>
        <div id="lista-paradas">Cargando paradas...</div>
      </div>

    </div>

    <!-- Contenedor del Mapa -->
    <div id="mapa"></div>
  </div>

  <script>
    // ========================================================
    // 1. CONFIGURACIÓN SUPABASE
    // ========================================================
    const SUPABASE_URL = 'https://ykwhdyvtlhjvusyjqlgb.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_l14m2kh-gahgx8xBwfX0hQ_xGAin';

    const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========================================================
    // 2. INICIALIZAR MAPA (Isla de Margarita)
    // ========================================================
    const mapa = L.map('mapa').setView([11.0000, -63.9000], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(mapa);

    let marcadoresBuses = {};
    let marcadorSeleccionadoBus = null;

    // ========================================================
    // 3. CARGAR HORARIOS Y VINCULAR CLIC A LA UNIDAD
    // ========================================================
    async function cargarHorarios() {
      const { data: horarios, error } = await clienteSupabase
        .from('horarios')
        .select(`
          id,
          id_ruta,
          dia_semana,
          hora_salida,
          observacion,
          rutas ( nombre_ruta )
        `)
        .order('hora_salida', { ascending: true });

      const contenedor = document.getElementById('lista-horarios');

      if (error || !horarios || horarios.length === 0) {
        contenedor.innerHTML = '<p style="font-size:0.85rem; color:#94A3B8;">No hay horarios cargados aún.</p>';
        return;
      }

      contenedor.innerHTML = '';

      horarios.forEach(h => {
        const horaFormateada = h.hora_salida.substring(0, 5);
        const ruta = h.rutas ? h.rutas.nombre_ruta : 'Ruta General';

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-horario';
        tarjeta.innerHTML = `
          <div class="info-horario">
            <span class="hora">🕒 ${horaFormateada}</span>
            <span class="ruta">${ruta}</span>
          </div>
          <button class="badge-accion">
            📍 Ver bus
          </button>
        `;

        // Al tocar la tarjeta o el botón de la hora, busca la ubicación en tiempo real de esa ruta/bus
        tarjeta.onclick = () => buscarUbicacionEnVivo(h.id_ruta, ruta, horaFormateada);

        contenedor.appendChild(tarjeta);
      });
    }

    // ========================================================
    // 4. LOCALIZAR LA UNIDAD EN EL MAPA AL TOCAR LA HORA
    // ========================================================
    async function buscarUbicacionEnVivo(idRuta, nombreRuta, hora) {
      // Buscamos si hay un bus asociado a esta ruta o la última ubicación reportada
      const { data: ubicaciones, error } = await clienteSupabase
        .from('ubicaciones_tiempo_real')
        .select(`
          *,
          buses ( id_ruta, placa )
        `)
        .order('timestamp', { ascending: false })
        .limit(1);

      if (error || !ubicaciones || ubicaciones.length === 0) {
        alert(`La unidad de la ruta "${nombreRuta}" (${hora}) aún no ha encendido el GPS en vivo.`);
        return;
      }

      const ultimaUbicacion = ubicaciones[0];
      const lat = ultimaUbicacion.latitud;
      const lng = ultimaUbicacion.longitud;

      // Centrar el mapa con animación de vuelo hacia el bus
      mapa.flyTo([lat, lng], 15, { duration: 1.5 });

      // Mostrar popup indicando qué unidad es
      if (marcadorSeleccionadoBus) {
        mapa.removeLayer(marcadorSeleccionadoBus);
      }

      marcadorSeleccionadoBus = L.marker([lat, lng]).addTo(mapa);
      marcadorSeleccionadoBus.bindPopup(`
        <div style="color: #111;">
          <b>🚌 Ruta: ${nombreRuta}</b><br>
          <b>Salida programada:</b> ${hora}<br>
          <b>Velocidad actual:</b> ${ultimaUbicacion.velocidad || 0} km/h<br>
          <span style="color: green; font-weight: bold;">● Transmitiendo en vivo</span>
        </div>
      `).openPopup();
    }

    // ========================================================
    // 5. PARADAS EN EL MAPA
    // ========================================================
    async function cargarParadas() {
      const { data: paradas } = await clienteSupabase.from('paradas').select('*');
      const contenedor = document.getElementById('lista-paradas');

      if (!paradas || paradas.length === 0) {
        contenedor.innerHTML = '<p style="font-size: 0.85rem; color:#94A3B8;">No hay paradas registradas.</p>';
        return;
      }

      contenedor.innerHTML = '';
      paradas.forEach(parada => {
        const marcador = L.marker([parada.latitud, parada.longitud]).addTo(mapa);
        marcador.bindPopup(`<b>🚏 Parada: ${parada.nombre_parada}</b>`);

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-parada';
        tarjeta.innerHTML = `<h3>🚏 ${parada.nombre_parada}</h3>`;
        tarjeta.onclick = () => {
          mapa.flyTo([parada.latitud, parada.longitud], 15);
          marcador.openPopup();
        };
        contenedor.appendChild(tarjeta);
      });
    }

    // Cargar datos iniciales
    cargarHorarios();
    cargarParadas();
  </script>
</body>
</html>
